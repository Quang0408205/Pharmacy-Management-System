services:
  mongodb:
    image: mongo:7
    container_name: pharmacy-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-pharmacy}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-pharmacy_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-pharmacy}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend/demo
    container_name: pharmacy-backend
    restart: unless-stopped
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-pharmacy}:${MONGO_ROOT_PASSWORD:-pharmacy_secret}@mongodb:27017/${MONGO_DATABASE:-pharmacy}?authSource=admin
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_MODE: ${API_MODE:-real}
        API_BASE_URL: ${API_BASE_URL:-/api/v1}
    container_name: pharmacy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  mongo-data:
