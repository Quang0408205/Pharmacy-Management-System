spring:
  application:
    name: pharmacy-backend
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/pharmacy?replicaSet=rs0&directConnection=true}
  data:
    mongodb:
      auto-index-creation: true
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  timezone: Asia/Ho_Chi_Minh
  security:
    jwt-secret: ${JWT_SECRET:}
    cookie-name: PMS_TOKEN
    cookie-secure: false
    session-ttl: 8h
    remember-ttl: 7d
    max-failed-logins: 5
    lock-duration: 15m
    activation-ttl: 72h
    reset-ttl: 30m
  seed:
    enabled: false
    default-password: ${SEED_DEFAULT_PASSWORD:}
    data-directory: ${APP_SEED_DATA_DIRECTORY:../../database/seed_data}
  system-reset:
    enabled: false
  storage:
    medicine-image-directory: ${APP_STORAGE_MEDICINE_IMAGE_DIRECTORY:./uploads/medicine-images}
